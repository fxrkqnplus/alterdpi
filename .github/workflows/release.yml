name: Pilot paket
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    environment: release
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      ALTERDPI_APPLICATION_SIGNING_KEY: ${{ secrets.ALTERDPI_APPLICATION_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.402'
      - name: Grafik kurulum derleyicisi
        run: choco install nsis --version=3.13 --no-progress -y
      - name: İmzalı paket
        run: ./tools/build.ps1 -MakeNsis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AlterDPI-0.5.0fx
          path: artifacts/release/*
          retention-days: 14
