name: Kontroller
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: dotnet build src/AlterDPI.App -c Release
      - run: dotnet run --project tests/AlterDPI.Tests -- "$pwd"
      - run: node tests/browser.test.cjs
      - run: powershell -NoProfile -ExecutionPolicy RemoteSigned -File tests/network.test.ps1
      - run: dotnet run --project tests/AlterDPI.UiTests
      - run: ./tools/build.ps1 -UnsignedCi
